name: Supabase Keep Alive

# 每 5 天自动访问一次 Supabase API，防止自由层项目因无活动被暂停
# Supabase 自由层项目 7 天无活动会自动暂停
on:
  schedule:
    - cron: '0 0 */5 * *'  # 每 5 天一次（UTC 0:00 = 北京时间 8:00）
  workflow_dispatch:        # 也支持手动触发

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          set +e
          echo "🏓 Pinging Supabase to keep project alive..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_K52rr3BWo7P3av_R3bAILA_WA9JGkv7" \
            -H "Authorization: Bearer sb_publishable_K52rr3BWo7P3av_R3bAILA_WA9JGkv7" \
            "https://rfwpwpfhbgfuydsfzibp.supabase.co/rest/v1/")
          CURL_EXIT=$?
          echo "HTTP status: $STATUS (curl exit code: $CURL_EXIT)"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "404" ]; then
            echo "✅ Supabase 项目已响应，活动已更新，不会被暂停"
          elif [ "$CURL_EXIT" -ne 0 ]; then
            echo "⚠️ curl 请求失败 (exit code: $CURL_EXIT)，项目可能已暂停或被删除，请检查 Supabase Dashboard"
          else
            echo "⚠️ 异常状态码: $STATUS（可能项目已暂停，需手动恢复）"
          fi
          exit 0
